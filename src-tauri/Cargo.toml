[package]
name = "desktop"
version = "1.0.2"
description = "NP-Tools Hardware Debugging Platform"
authors = ["you"]
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serial-core = { path = "../crates/serial-core" }
app-types = { path = "../crates/app-types" }
device-protocol = { path = "../crates/device-protocol" }
flash-service = { path = "../crates/flash-service" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tauri-plugin-dialog = "2.7.2"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rumqttc = "0.24"
