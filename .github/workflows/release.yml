name: 'Release and Build Installers'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            target: ''
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Run unit tests
        run: pnpm run test:kz3-debug

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: v__VERSION__
          releaseName: 'NP-Tools v__VERSION__'
          releaseBody: |
            ## NP-Tools v__VERSION__ 发布包

            基于 Tauri v2 + Rust 构建的跨平台工业硬件调试与产线配置平台。

            ### 包含安装包：
            - **Windows**: `.exe` (NSIS 安装包) / `.msi` (Windows Installer)
            - **macOS (Apple Silicon M系列)**: `aarch64` `.dmg`
            - **macOS (Intel 系列)**: `x86_64` `.dmg`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
