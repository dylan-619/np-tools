[package]
name = "serial-core"
version = "0.1.0"
edition = "2024"

[dependencies]
app-types = { path = "../app-types" }
tokio-serial = "5.4.4"
tokio = { version = "1.41.0", features = ["full"] }
uuid = { version = "1.11.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
bytes = "1.8.0"
